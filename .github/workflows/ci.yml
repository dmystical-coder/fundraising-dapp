name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Lint (front-end)
        run: npm run lint -w front-end

      - name: Typecheck (front-end)
        run: npm exec -w front-end -- tsc --noEmit

      - name: Test (Clarity contracts)
        run: npm run test -w clarity

      - name: Build (front-end)
        run: npm run build -w front-end
