<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bgGrad)"/>

  <!-- Staircase block 1 — bottom-left, faded (completed milestone) -->
  <rect x="32" y="168" width="56" height="56" rx="10" ry="10" fill="white" fill-opacity="0.45"/>

  <!-- Staircase block 2 — middle, bright (current milestone) -->
  <rect x="100" y="100" width="56" height="56" rx="10" ry="10" fill="white" fill-opacity="0.80"/>

  <!-- Staircase block 3 — top-right, teal (goal / active milestone) -->
  <rect x="168" y="32" width="56" height="56" rx="10" ry="10" fill="#14B8A6"/>
</svg>
